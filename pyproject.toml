[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ilume-pretrain"
version = "0.1.0"
description = "Multimodal molecular pretraining and physics representation training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atomInSmiles==1.0.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "rdkit>=2024.3",
    "torch>=2.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
tokenizers = [
    "tokenizers==0.22.2",
    "SmilesPE==0.0.3",
    "apetokenizer @ git+https://github.com/mikemayuare/apetokenizer.git@ff1b3cc00476a8d017d7d54e925681a04475d47f",
]
benchmarks = [
    "scikit-learn>=1.7,<2",
    "xgboost>=3.3,<4",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["common*", "stage1*", "stage2*", "stage3*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]
