[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ilume-pretrain"
version = "0.1.0"
description = "Multimodal molecular pretraining and property-alignment training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atomInSmiles==1.0.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "rdkit>=2024.3",
    "torch>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
tokenizers = [
    "tokenizers==0.22.2",
    "SmilesPE==0.0.3",
    "apetokenizer @ git+https://github.com/mikemayuare/apetokenizer.git@ff1b3cc00476a8d017d7d54e925681a04475d47f",
]

[project.scripts]
ilume-prepare = "ilume_pretrain.cli.prepare:main"
ilume-smoke = "ilume_pretrain.cli.smoke:main"
ilume-train = "ilume_pretrain.cli.train:main"
ilume-stage2-prepare = "ilume_pretrain.cli.stage2_prepare:main"
ilume-stage2-train = "ilume_pretrain.cli.stage2_train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
