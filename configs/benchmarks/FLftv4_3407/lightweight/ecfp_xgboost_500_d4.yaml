protocol: flft_v4_3407_22_xgboost_lightweight
name: ecfp_xgboost
display_name: ECFP+XGBoost (500 trees, depth 4)
seed: 42
data:
  data_root: data/3407
  task_catalog: data/3407/task_catalog.csv
  stage3_authority_config: configs/v4/stage3/base.yaml
  feature_cache: outputs/benchmarks/FLftv4_3407/lightweight/cache/features.sqlite3
features:
  kind: ecfp4
  radius: 2
  n_bits: 2048
model:
  n_estimators: 500
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  objective: reg:squarederror
  eval_metric: mae
  tree_method: hist
training:
  model_selection: final_training_state
  n_jobs: 8
  device: cpu
  target_space: raw
stage3:
  enabled: true
  tasks:
  - experiment/electrical_conductivity
  - experiment/viscosity
  - experiment/density
  - experiment/surface_tension
  - experiment/glass_transition_temperature
  - experiment/melting_point
  - experiment/thermal_decomposition_temperature
  - experiment/refractive_index
  - experiment/solvation
  - experiment/hydration
  - experiment/self_diffusion_coefficient
  - experiment/thermal_conductivity
  - experiment/heat_capacity
  - experiment/speed_of_sound
  - experiment/dynamic_relative_permittivity
  - experiment/static_relative_permittivity
  - experiment/transfer_organic
  - experiment/pec50
  - experiment/gas_solubility
  - experiment/enthalpy_of_vaporization_or_sublimation
  - experiment/anodic_potential_limit
  - experiment/cathodic_potential_limit
  folds:
  - 1
  - 2
  - 3
  - 4
  - 5
simulation:
  enabled: true
  tasks:
  - simulation/thermal_expansion
  - simulation/homo
  - simulation/lumo
