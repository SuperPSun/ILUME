protocol: flft_v4_3407_22_completion
name: mlp
display_name: MLP
seed: 42
data:
  data_root: data/3407
  task_catalog: data/3407/task_catalog.csv
  stage3_authority_config: configs/v4/stage3/base.yaml
  feature_cache: outputs/benchmarks/FLftv4_3407/completion_22/cache/features.sqlite3
features:
  kind: basic_molecular_statistics
model:
  hidden_dims:
  - 128
  - 64
  dropout: 0.2
training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.001
  batch_size: 128
  max_epochs: 10
  loss: normalized_mse
  model_selection: final_training_state
  device: cuda
  precision: fp32
stage3:
  enabled: true
  tasks:
  - experiment/self_diffusion_coefficient
  - experiment/thermal_conductivity
  - experiment/heat_capacity
  - experiment/speed_of_sound
  - experiment/dynamic_relative_permittivity
  - experiment/static_relative_permittivity
  - experiment/transfer_organic
  - experiment/pec50
  - experiment/gas_solubility
  - experiment/enthalpy_of_vaporization_or_sublimation
  - experiment/anodic_potential_limit
  - experiment/cathodic_potential_limit
  folds:
  - 1
  - 2
  - 3
  - 4
  - 5
simulation:
  enabled: true
  tasks:
  - simulation/thermal_expansion
  - simulation/homo
  - simulation/lumo
