  loss: mse
  model_selection: final_training_state
  device: cuda
  precision: fp32
  adaptation_mode: frozen_pretrained
runtime:
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  non_blocking_transfer: true
