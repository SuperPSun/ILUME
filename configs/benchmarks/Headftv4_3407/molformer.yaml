protocol: headft_v4_3407_22
name: molformer
display_name: MoLFormer-XL-both-10pct (frozen pretrained)
seed: 42
environment:
  name: ilume-molformer
  definition: benchmarks/molformer/environment.yml
  lock: benchmarks/molformer/requirements-linux-x86_64-cu128.lock
data:
  data_root: data/3407
  task_catalog: data/3407/task_catalog.csv
  stage3_authority_config: configs/v4/stage3/base.yaml
model:
  repository: ibm-research/MoLFormer-XL-both-10pct
  revision: 361063d0ad524ef77cf39b08469f6be770dc550f
