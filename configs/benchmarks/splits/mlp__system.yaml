name: mlp
display_name: MLP (system split)
seed: 42
data:
  data_root: data
  task_catalog: data/task_catalog.csv
  stage3_authority_config: configs/v2/stage3/splits/system.yaml
  feature_cache: outputs/benchmarks/cache/features.sqlite3
features:
  kind: basic_molecular_statistics
model:
  hidden_dims:
  - 128
  - 64
  dropout: 0.2
training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.001
  batch_size: 128
  max_epochs: 10
  loss: normalized_mse
  model_selection: final_training_state
  device: cuda
  precision: fp32
stage3:
  enabled: true
  tasks: all
  folds:
  - 1
  - 2
  - 3
  - 4
  - 5
