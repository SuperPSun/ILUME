name: molformer
display_name: MoLFormer-XL-both-10pct (anion split)
seed: 42
environment:
  name: ilume-molformer
  definition: benchmarks/molformer/environment.yml
  lock: benchmarks/molformer/requirements-linux-x86_64-cu128.lock
data:
  data_root: data
  task_catalog: data/task_catalog.csv
  stage3_authority_config: configs/v2/stage3/splits/anion.yaml
model:
  repository: ibm-research/MoLFormer-XL-both-10pct
  revision: 361063d0ad524ef77cf39b08469f6be770dc550f
  trust_remote_code: true
  pretrained: true
  full_fine_tuning: true
  deterministic_eval: true
  remove_stereochemistry: true
  max_input_tokens: 202
  hidden_dim: 768
  shared_backbone: true
  fusion: ordered_concat_linear
  regression_head: official_sequence_classification
  input_cache: unique_smiles_memory_token_cache
  component_forward: merged_component_backbone_forward
training:
  optimizer: adamw
  encoder_learning_rate: 5.0e-06
  new_parameter_learning_rate: 5.0e-05
  weight_decay: 0.01
  scheduler: cosine
  warmup_fraction: 0.05
  batch_size: 128
  gradient_accumulation_steps: 1
  max_epochs: 50
  early_stopping_patience: 8
  tf32: true
  length_bucketing: sortish_length_bucketing_v1
  bucket_window_batches: 20
  loss: mse
  selection_metric: validation_mae
  device: cuda
  precision: fp32
runtime:
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  non_blocking_transfer: true
stage3:
  enabled: true
  tasks: all
  folds:
  - 1
  - 2
  - 3
  - 4
  - 5
stage2_physics:
  enabled: false
  tasks: []
