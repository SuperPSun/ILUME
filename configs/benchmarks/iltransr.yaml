  conversion_manifest: artifacts/benchmarks/iltransr/pretraining/conversion_manifest.json
  conversion_manifest_sha256: b1d386e8e501ffab171819a24008115e1704dfa72b2095f871fd2f1dd609619d
  pretrained: true
  full_fine_tuning: true
  character_tokenization: true
  isomeric_smiles: false
  max_length: 100
  shared_encoder: true
  fusion: registry_role_ordered_concat
  property_specific_weights: false
training:
  optimizer: adam
  learning_rate: 1.0e-3
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
  scheduler: factor_every_10_epochs
  lr_decay_epochs: 10
  lr_decay_factor: 0.5
  loss: train_population_zscore_l1
  condition_transform: task_global_stage3_population_zscore
  model_selection: final_training_state
  validation_policy: reporting_only_each_epoch
  checkpoint_policy: nonresumable_final_state_only
  device: cuda
  precision: fp32
  tf32: false
  fallback_recipe: {epochs: 10, batch_size: 64, dropout: 0.1}
  official_recipes:
    experiment/density: {epochs: 10, batch_size: 128, dropout: 0.05, notebook: Density_train.ipynb}
    experiment/viscosity: {epochs: 10, batch_size: 128, dropout: 0.05, notebook: viscosity_train.ipynb}
    experiment/heat_capacity: {epochs: 10, batch_size: 256, dropout: 0.05, notebook: CP_train.ipynb}
    experiment/melting_point: {epochs: 10, batch_size: 64, dropout: 0.1, notebook: "melting point_train.ipynb"}
    experiment/thermal_decomposition_temperature: {epochs: 10, batch_size: 128, dropout: 0.05, notebook: TD_train.ipynb}
    experiment/x_co2: {epochs: 10, batch_size: 64, dropout: 0.05, notebook: co2solubility_train.ipynb}
    experiment/pec50: {epochs: 10, batch_size: 64, dropout: 0.1, notebook: tox_train.ipynb}
runtime:
  num_workers: 0
stage3:
  enabled: true
  tasks: all
  folds: [1, 2, 3, 4, 5]
