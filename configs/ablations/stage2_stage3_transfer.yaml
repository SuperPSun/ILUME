name: stage2_stage3_transfer
seed: 42
stage2:
  authority_config: configs/v2/stage2/base.yaml
  stage1_checkpoint: outputs/v2/stage1/base/train/checkpoint_epoch_00005.pt
  prepared_artifacts: outputs/v2/stage2/base/prepare/artifacts
  sources:
    - simulation/density
    - simulation/heat_capacity
    - simulation/heat_of_vaporization
    - simulation/homo
    - simulation/lumo
    - simulation/partial_atomic_charge
    - simulation/simulated_qm_elec_hf
    - simulation/thermal_expansion
    - simulation/transfer_organic
  epochs: 10
  object_layers: 2
  object_ffn_dim: 2048
  dropout: 0.10
  batch_size: 256
  backbone_frozen_epochs: 1
  backbone_learning_rate: 1.0e-5
  object_encoder_learning_rate: 3.0e-5
  task_head_learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  amp_dtype: bf16
  optimizer: AdamW
  physics_only: true
  final_epoch: 10
stage3:
  authority_config: configs/v2/stage3/base.yaml
  prepared_artifacts: outputs/v2/stage3/base/prepare/artifacts
  targets:
    - experiment/density
    - experiment/dynamic_relative_permittivity
    - experiment/electrical_conductivity
    - experiment/equilibrium_pressure
    - experiment/glass_transition_temperature
    - experiment/heat_capacity
    - experiment/melting_point
    - experiment/pec50
    - experiment/refractive_index
    - experiment/self_diffusion_coefficient
    - experiment/solvation
    - experiment/speed_of_sound
    - experiment/static_relative_permittivity
    - experiment/surface_tension
    - experiment/thermal_conductivity
    - experiment/thermal_decomposition_temperature
    - experiment/transfer
    - experiment/transfer_organic
    - experiment/viscosity
    - experiment/x_co2
  folds: [1, 2, 3, 4, 5]
  hidden_dims: [512, 256]
  dropout: 0.10
  batch_size: 128
  epochs: 10
  learning_rate: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  smooth_l1_beta: 1.0
  warmup_fraction: 0.05
  min_lr_ratio: 0.05
  max_grad_norm: 1.0
  amp_dtype: bf16
  selection: final
  metric: validation_raw_mae
