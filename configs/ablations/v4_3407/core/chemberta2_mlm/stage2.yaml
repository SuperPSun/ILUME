# C12/C13：冻结外部ChemBERTa-2，不提供显式RDKit217；配对optimized_3407。
data:
  data_root: data/3407
  task_catalog_path: data/3407/task_catalog.csv
  pretrain_artifacts_dir: null
  artifacts_dir: outputs/ablations/v4_3407/chemberta2_mlm/stage2/prepare/artifacts
  entity_shard_size: 4096
  seed: 3407
  target_materialization_modes: {}
  tasks:
  - simulation/density
  - simulation/heat_capacity
  - simulation/heat_of_vaporization
  - simulation/thermal_expansion
  - simulation/transfer_organic
preparation:
  workers: 8
  teacher_batch_size: null
  data_metadata_path: outputs/ablations/v4_3407/chemberta2_mlm/stage2/prepare/data_metadata.json
  reference_artifacts: outputs/v4/stage2/optimized_3407/prepare/artifacts
initialization:
  checkpoint: null
model:
  architecture_kind: entity_home_v1
  dropout: 0.1
loss:
  lambda_teacher: 0.0
  teacher_weighting: task_compensated
  task_weights:
    simulation/density: 1.0
    simulation/heat_capacity: 0.8
    simulation/heat_of_vaporization: 1.0
    simulation/thermal_expansion: 0.8
    simulation/transfer_organic: 0.5
  task_loss_modes: {}
training:
  batch_size: 256
  gradient_accumulation_steps: 1
  epochs: 10
  backbone_frozen_epochs: 0
  backbone_learning_rate: 1.0e-05
  task_head_learning_rate: 0.0001
  weight_decay: 0.01
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  packing_workers: 4
  packing_prefetch_batches: 4
  cuda_prefetch_batches: 1
  log_every_batches: 50
  device: auto
  amp_dtype: bf16
  refinement_epochs: 0
  refinement_tasks: []
  refinement_lr_multiplier: 0.1
  seed: 42
home:
  freeze_stage1: true
  microbatch_size: 256
  initialization: pretrained
  random_seed: null
  model:
    global_experts: 2
    private_experts: 1
    dropout: 0.1
    activation: silu
    expert_hidden_ratio: 2.0
    interaction_hidden_ratio: 2.0
    film_hidden_ratio: 1.0
    tower_hidden_ratio: 1.0
    l2_residual: true
  groups:
    thermophysical:
      enabled: true
      group_weight: 1.0
      experts: 2
      expert_hidden_ratio: 1.5
      phase1:
        lr: 0.00015
        epochs: 10
      phase2:
        lr: 7.5e-05
        epochs: 4
    solvation:
      enabled: true
      group_weight: 1.0
      experts: 3
      expert_hidden_ratio: 1.5
      phase1:
        lr: 0.0002
        epochs: 15
      phase2:
        lr: 0.0001
        epochs: 24
frozen_encoder:
  kind: chemberta2
  variant: chemberta2_mlm
  repo_id: DeepChem/ChemBERTa-77M-MLM
  revision: ed8a5374f2024ec8da53760af91a33fb8f6a15ff
  snapshot_dir: assets/chemberta2/chemberta2_mlm
  pooling: last_hidden_cls
  include_rdkit: false
