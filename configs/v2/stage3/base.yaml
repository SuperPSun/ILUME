data:
  stage3_dir: data/stage3
  task_catalog: data/task_catalog.csv
  artifacts_dir: outputs/v2/stage3/base/prepare/artifacts
  split_policy: prefer_il
  split_strategies: {}
  cv_repeat: 1
  cv_repeats: {}
  seed: 42
preparation:
  encoding_batch_size: 256
  cache_dir: outputs/v2/stage3/base/prepare/object_cache
initialization:
  stage2_encoder: outputs/v2/stage2/base/train/stage2_encoder.pt
  plugin: null
model:
  global_experts: 2
  private_experts: 1
  dropout: 0.10
  activation: silu
  expert_hidden_ratio: 2.0
  interaction_hidden_ratio: 2.0
  film_hidden_ratio: 1.0
  tower_hidden_ratio: 1.0
  l2_residual: true
groups:
  transport: {enabled: true, group_weight: 1.0, experts: 2, expert_hidden_ratio: 1.5, phase_c_epochs: 15}
  thermophysical: {enabled: true, group_weight: 1.0, experts: 2, expert_hidden_ratio: 1.5, phase_c_epochs: 10}
  phase_stability: {enabled: true, group_weight: 1.0, experts: 3, expert_hidden_ratio: 1.5, phase_c_epochs: 20}
  dielectric_optical: {enabled: true, group_weight: 1.0, experts: 1, expert_hidden_ratio: 0.75, phase_c_epochs: 5}
  solvation: {enabled: true, group_weight: 1.0, experts: 3, expert_hidden_ratio: 1.5, phase_c_epochs: 25}
  biological: {enabled: true, group_weight: 1.0, experts: 1, expert_hidden_ratio: 0.5, phase_c_epochs: 5}
tasks:
  experiment/electrical_conductivity: {meta_group: transport, phase_d_epochs: 15, model_overrides: {private_lr_scale: 0.75}}
  experiment/self_diffusion_coefficient: {meta_group: transport, phase_d_epochs: 10, model_overrides: {private_lr_scale: 0.25}}
  experiment/viscosity: {meta_group: transport, phase_d_epochs: 5, model_overrides: {private_lr_scale: 1.0}}
  experiment/thermal_conductivity: {meta_group: transport, phase_d_epochs: 5, model_overrides: {private_lr_scale: 0.25}}
  experiment/density: {meta_group: thermophysical, phase_d_epochs: 5, model_overrides: {private_lr_scale: 1.0}}
  experiment/heat_capacity: {meta_group: thermophysical, phase_d_epochs: 3, model_overrides: {private_lr_scale: 0.5}}
  experiment/isobaric_coefficient_of_volume_expansion: {meta_group: thermophysical, phase_d_epochs: 3, model_overrides: {private_lr_scale: 0.25}}
  experiment/speed_of_sound: {meta_group: thermophysical, phase_d_epochs: 3, model_overrides: {private_lr_scale: 0.5}}
  experiment/surface_tension: {meta_group: thermophysical, phase_d_epochs: 10, model_overrides: {private_lr_scale: 0.75}}
  experiment/equilibrium_pressure: {meta_group: phase_stability, phase_d_epochs: 3, model_overrides: {private_lr_scale: 0.25}}
  experiment/glass_transition_temperature: {meta_group: phase_stability, phase_d_epochs: 5, model_overrides: {private_lr_scale: 0.75}}
  experiment/melting_point: {meta_group: phase_stability, phase_d_epochs: 10, model_overrides: {private_lr_scale: 1.0}}
  experiment/thermal_decomposition_temperature: {meta_group: phase_stability, phase_d_epochs: 10, model_overrides: {private_lr_scale: 1.0}}
  experiment/dynamic_relative_permittivity: {meta_group: dielectric_optical, phase_d_epochs: 3, model_overrides: {private_lr_scale: 0.25}}
  experiment/static_relative_permittivity: {meta_group: dielectric_optical, phase_d_epochs: 5, model_overrides: {private_lr_scale: 0.25}}
  experiment/refractive_index: {meta_group: dielectric_optical, phase_d_epochs: 5, model_overrides: {private_lr_scale: 0.75}}
  experiment/solvation:
    meta_group: solvation
    phase_d_epochs: 5
    model_overrides: {private_lr_scale: 1.0}
    partner_mode: interaction
    primary_slots: [cation, anion]
    partner_slots: [solute]
  experiment/transfer:
    meta_group: solvation
    phase_d_epochs: 10
    model_overrides: {private_lr_scale: 1.0}
    partner_mode: interaction
    primary_slots: [cation, anion]
    partner_slots: [solute]
  experiment/transfer_organic:
    meta_group: solvation
    phase_d_epochs: 20
    model_overrides: {private_lr_scale: 0.75}
    partner_mode: interaction
    primary_slots: [solute]
    partner_slots: [solvent]
  experiment/x_co2: {meta_group: solvation, phase_d_epochs: 3, model_overrides: {private_lr_scale: 0.5}}
  experiment/pec50: {meta_group: biological, phase_d_epochs: 10, model_overrides: {private_lr_scale: 0.5}}
training:
  composite_batch_size: 2048
  microbatch_size: 1024
  sampling_mode: raw
  schedule_mode: four_phase
  four_phase:
    bootstrap: {epochs: 5, global_lr: 3.0e-4, group_lr: 3.0e-4, private_lr: 3.0e-4, warmup_ratio: 0.05, min_lr_ratio: 0.5}
    consolidation: {epochs: 10, global_lr: 3.0e-5, group_lr: 1.0e-4, private_lr: 1.5e-4, min_lr_ratio: 0.2}
    group_specialization: {group_lr: 7.5e-5, private_lr: 1.0e-4, min_lr_ratio: 0.2}
    task_specialization: {private_lr: 1.0e-4, min_lr_ratio: 0.1}
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  max_grad_norm: 1.0
  joint_gradient_clip_mode: ownership
  smooth_l1_beta: 1.0
  amp_dtype: bf16
  optimizer_implementation: single_tensor
  active_tasks: auto
  checkpoint_interval_epochs: 10
  device: cuda
  cpu_threads: 4
  cpu_interop_threads: 1
  debug_pcgrad_traces: false
