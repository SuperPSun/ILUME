  private_experts: 1
  dropout: 0.1
  activation: silu
  expert_hidden_ratio: 2.0
  interaction_hidden_ratio: 2.0
  film_hidden_ratio: 1.0
  tower_hidden_ratio: 1.0
  l2_residual: true
groups:
  transport:
    enabled: true
    group_weight: 1.0
    experts: 2
    expert_hidden_ratio: 1.5
    phase1: {lr: 0.000125, epochs: 12}
    phase2: {lr: 0.0000625, epochs: 12}
  thermophysical:
    enabled: true
    group_weight: 1.0
    experts: 2
    expert_hidden_ratio: 1.5
    phase1: {lr: 0.000125, epochs: 10}
    phase2: {lr: 0.0000625, epochs: 5}
  phase_stability:
