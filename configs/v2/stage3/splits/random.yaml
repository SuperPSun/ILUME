training:
  composite_batch_size: 2048
  microbatch_size: 1024
  sampling_mode: raw
  schedule_mode: three_phase
  three_phase:
    global: {lr: 2.5e-4, epochs: 15, warmup_ratio: 0.05, min_lr_ratio: 0.1}
    phase1_min_lr_ratio: 0.5
    phase2_min_lr_ratio: 0.5
    phase3_min_lr_ratio: 0.2
    private_classes:
      tiny: {width_ratio: 0.5, phase1: {lr: 4.0e-5, epochs: 6}, phase2: {lr: 2.0e-5, epochs: 3}, phase3_lr: 1.0e-5}
      small: {width_ratio: 0.75, phase1: {lr: 6.0e-5, epochs: 8}, phase2: {lr: 3.0e-5, epochs: 4}, phase3_lr: 1.5e-5}
      medium: {width_ratio: 1.0, phase1: {lr: 8.0e-5, epochs: 12}, phase2: {lr: 4.0e-5, epochs: 8}, phase3_lr: 2.0e-5}
      large: {width_ratio: 1.0, phase1: {lr: 1.0e-4, epochs: 15}, phase2: {lr: 5.0e-5, epochs: 12}, phase3_lr: 2.5e-5}
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  max_grad_norm: 1.0
  joint_gradient_clip_mode: ownership
  smooth_l1_beta: 1.0
  amp_dtype: bf16
  optimizer_implementation: single_tensor
  active_tasks: auto
  checkpoint_interval_epochs: 10
  device: cuda
  cpu_threads: 1
  cpu_interop_threads: 1
  debug_pcgrad_traces: false
