data:
  stage3_dir: data/stage3
  task_catalog: data/task_catalog.csv
  artifacts_dir: outputs/v2/stage3/splits/random/prepare/artifacts
  split_policy: random
  split_strategies: {}
  cv_repeat: 1
  cv_repeats: {}
  seed: 42
preparation:
  encoding_batch_size: 256
  cache_dir: outputs/v2/stage3/splits/random/prepare/object_cache
initialization:
  stage2_encoder: outputs/v2/stage2/base/train/stage2_encoder.pt
  plugin: null
model:
