architecture: {kind: global_rdkit_v2}
data:
  stage1_dir: data/stage1
  artifacts_dir: outputs/v2/stage1/base/prepare/artifacts
  valid_fraction: 0.05
  seed: 42
  max_smiles_tokens: 256
  descriptor_dim: 217
  max_samples_per_role: null
  shard_size: 8192
  shard_cache_size: 4
  include_augmentation: true
tokenizer: {backend: ais, vocab_size: 2048, min_frequency: 1}
descriptor: {mode: full, token_count: 1, correlation_threshold: 0.98}
preparation:
  workers: 16
  catalog_batch_size: 10000
  qc_batch_size: 2048
  tokenizer_batch_size: 2048
  descriptor_batch_size: 512
masking:
  smiles_ratio: 0.15
  atom_ratio: 0.15
  bond_ratio: 0.15
  descriptor_ratio: 0.15
  smiles_dropout: 0.10
  graph_dropout: 0.10
  descriptor_dropout: 0.10
  dropout_schedule: curriculum
  asymmetric_enabled: true
  asymmetric_probability: 0.25
  asymmetric_ratio: 0.50
model:
  d_model: 512
  n_heads: 8
  smiles_layers: 8
  graph_depth: 6
  descriptor_hidden_dim: 1024
  descriptor_blocks: 2
  fusion_layers: 8
  feedforward_dim: 2048
  dropout: 0.10
  role_embedding: true
  graph_head: mlp
  gradient_checkpointing: false
loss:
  lambda_smiles: 1
  lambda_descriptor: 1
  lambda_atom: 1
  lambda_bond: 1
  role_weights: [2.0, 2.0, 1.0]
training:
  batch_size: 128
  epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  num_workers: 8
  device: auto
  amp_dtype: bf16
  compile: false
  validation_interval_steps: 5000
  quick_validation_samples_per_role: 256
