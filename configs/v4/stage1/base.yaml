architecture: {kind: dual_view_v4}
data:
  stage1_dir: data/stage1
  artifacts_dir: outputs/v4/stage1/base/prepare/artifacts
  valid_fraction: 0.05
  seed: 42
  max_smiles_tokens: 256
  descriptor_dim: 217
  max_samples_per_role: null
  shard_size: 8192
  shard_cache_size: 4
  include_augmentation: true
tokenizer: {backend: ais, vocab_size: 2048, min_frequency: 1}
descriptor: {mode: full, token_count: 1, correlation_threshold: 0.98}
preparation:
  workers: 16
  catalog_batch_size: 10000
  qc_batch_size: 2048
  tokenizer_batch_size: 2048
  descriptor_batch_size: 512
masking:
  smiles_ratio: 0.15
  atom_ratio: 0.15
  bond_ratio: 0.15
  descriptor_ratio: 0.0
  smiles_dropout: 0.10
  graph_dropout: 0.10
  descriptor_dropout: 0.0
  dropout_schedule: static
  asymmetric_enabled: false
  fusion_only_dropout: true
model:
  d_model: 512
  n_heads: 8
  smiles_layers: 8
  graph_depth: 6
  descriptor_hidden_dim: 1024
  descriptor_blocks: 2
  fusion_layers: 0
  feedforward_dim: 2048
  dropout: 0.10
  role_embedding: false
  graph_head: mlp
  gradient_checkpointing: false
loss:
  lambda_smiles: 1.0
  lambda_descriptor: 1.0
  lambda_atom: 1.0
  lambda_bond: 1.0
  lambda_alignment: 0.1
  lambda_unimol: 0.1
  lambda_electronic: 0.1
  role_weights: [2.0, 2.0, 1.0]
auxiliary:
  simulation_dir: data/stage2
  teacher_cache: outputs/v4/stage1/base/teacher
  teacher_checkpoint: assets/unimol2/modelzoo/84M/checkpoint.pt
  teacher_version: 0.1.3.post1
  teacher_shard_size: 4096
training:
  batch_size: 128
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  num_workers: 8
  device: auto
  amp_dtype: bf16
  compile: false
  validation_interval_steps: 5000
  quick_validation_samples_per_role: 256
