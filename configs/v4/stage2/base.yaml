data:
  data_root: data
  task_catalog_path: data/task_catalog.csv
  pretrain_artifacts_dir: outputs/v4/stage1/base/prepare/artifacts
  artifacts_dir: outputs/v4/stage2/base/prepare/artifacts
  entity_shard_size: 4096
  seed: 42
  target_materialization_modes: {}
  tasks:
  - simulation/density
  - simulation/heat_capacity
  - simulation/heat_of_vaporization
  - simulation/thermal_expansion
  - simulation/transfer_organic
preparation:
  workers: 8
  teacher_batch_size: null
initialization:
  checkpoint: outputs/v4/stage1/base/train/stage1_encoder.pt
model:
  architecture_kind: entity_home_v1
  dropout: 0.1
loss:
  lambda_teacher: 0.0
  teacher_weighting: task_compensated
  task_weights:
    simulation/density: 1.0
    simulation/heat_capacity: 0.8
    simulation/heat_of_vaporization: 1.0
    simulation/thermal_expansion: 0.8
    simulation/transfer_organic: 0.5
  task_loss_modes: {}
training:
  batch_size: 256
  gradient_accumulation_steps: 1
  epochs: 10
  backbone_frozen_epochs: 0
  backbone_learning_rate: 1.0e-05
  task_head_learning_rate: 0.0001
  weight_decay: 0.01
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  packing_workers: 4
  packing_prefetch_batches: 4
  cuda_prefetch_batches: 1
  log_every_batches: 50
  device: auto
  amp_dtype: bf16
  refinement_epochs: 0
  refinement_tasks: []
  refinement_lr_multiplier: 0.1
home:
  freeze_stage1: true
  microbatch_size: 256
  initialization: pretrained
  random_seed: null
  model:
    global_experts: 2
    private_experts: 1
    dropout: 0.1
    activation: silu
    expert_hidden_ratio: 2.0
    interaction_hidden_ratio: 2.0
    film_hidden_ratio: 1.0
    tower_hidden_ratio: 1.0
    l2_residual: true
  groups:
    thermophysical:
      enabled: true
      group_weight: 1.0
      experts: 2
      expert_hidden_ratio: 1.5
      phase1:
        lr: 0.00015
        epochs: 10
      phase2:
        lr: 7.5e-05
        epochs: 4
    solvation:
      enabled: true
      group_weight: 1.0
      experts: 3
      expert_hidden_ratio: 1.5
      phase1:
        lr: 0.0002
        epochs: 15
      phase2:
        lr: 0.0001
        epochs: 24
