data:
  stage1_dir: data/stage1
  artifacts_dir: artifacts/legacy
  valid_fraction: 0.05
  seed: 42
  max_smiles_tokens: 256
  descriptor_dim: 217
  max_samples_per_role: null
  shard_size: 8192
  shard_cache_size: 4
  augmentation: {cation: 0, anion: 0, neutral: 0}
tokenizer: {backend: ais, vocab_size: 2048, min_frequency: 2}
descriptor: {mode: full, token_count: 1, correlation_threshold: 0.98}
fingerprint: {kind: none, morgan_radius: 2, morgan_bits: 2048, maccs_bits: 167, chunk_size: 128}
sampling: {role_probabilities: [0.45, 0.45, 0.10], require_full_coverage: true}
masking:
  smiles_ratio: 0.15
  atom_ratio: 0.15
  bond_ratio: 0.15
  descriptor_ratio: 0.15
  fingerprint_ratio: 0.15
  smiles_dropout: 0.10
  graph_dropout: 0.10
  descriptor_dropout: 0.10
  fingerprint_dropout: 0.10
  dropout_schedule: static
  asymmetric_enabled: false
  asymmetric_probability: 0.25
  asymmetric_ratio: 0.50
model:
  d_model: 128
  n_heads: 4
  smiles_layers: 2
  graph_depth: 3
  descriptor_hidden_dim: 256
  descriptor_blocks: 2
  fusion_layers: 2
  feedforward_dim: 512
  dropout: 0.10
  role_embedding: false
  graph_head: linear
  gradient_checkpointing: false
loss: {lambda_smiles: 1, lambda_descriptor: 1, lambda_atom: 1, lambda_bond: 1, lambda_fingerprint: 0}
