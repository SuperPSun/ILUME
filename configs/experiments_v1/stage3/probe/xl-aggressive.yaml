training:
  seed: 42
  composite_batch_size: 2048
  microbatch_size: 1024
  virtual_min_size: 1000
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  warmup_ratio: 0.05
  min_lr_ratio: 0.05
  max_grad_norm: 1.0
  smooth_l1_beta: 1.0
  amp_dtype: bf16
  optimizer_implementation: single_tensor
  active_tasks: auto
  checkpoint_interval_epochs: 10
  device: cuda
  cpu_threads: 4
  cpu_interop_threads: 1
  debug_pcgrad_traces: false
