data:
  stage3_dir: data/stage3
  task_catalog: data/task_catalog.csv
  artifacts_dir: outputs/experiments_v1/stage3/prepare/xl-aggressive/artifacts
  split_policy: prefer_il
  split_strategies: {}
  cv_repeat: 1
  cv_repeats: {}
  seed: 42
preparation:
  encoding_batch_size: 256
  cache_dir: outputs/experiments_v1/stage3/prepare/xl-aggressive/object_cache
initialization:
  stage2_encoder: outputs/experiments_v1/stage2/xl/aggressive/train/stage2_encoder.pt
  plugin: null
model:
  global_experts: 2
  group_experts: 2
  private_experts: 1
  dropout: 0.1
  activation: silu
  expert_hidden_ratio: 2.0
  interaction_hidden_ratio: 2.0
  film_hidden_ratio: 1.0
  tower_hidden_ratio: 1.0
  l2_residual: true
groups:
  transport:
    enabled: true
    group_weight: 1.0
  thermophysical:
    enabled: true
    group_weight: 1.0
  phase_stability:
    enabled: true
    group_weight: 1.0
  dielectric_optical:
    enabled: true
    group_weight: 1.0
  solvation:
    enabled: true
    group_weight: 1.0
  biological:
    enabled: true
    group_weight: 1.0
