data:
  data_root: data
  task_catalog_path: data/task_catalog.csv
  pretrain_artifacts_dir: outputs/experiments_v1/stage1/base/prepare/artifacts
  artifacts_dir: outputs/experiments_v1/stage2/prepare/artifacts
  entity_shard_size: 4096
  seed: 42
  target_materialization_modes:
    simulation/simulated_qm_elec_hf: allow_partial_drop_all_missing
preparation:
  workers: 8
  teacher_batch_size: 512
initialization:
  checkpoint: outputs/experiments_v1/stage1/base/train/checkpoint_epoch_00015.pt
model:
  object_layers: 2
  object_ffn_dim: 1024
  dropout: 0.1
loss:
  lambda_teacher: 0.075
  task_weights:
    simulation/density: 1.0
    simulation/heat_capacity: 0.8
    simulation/heat_of_vaporization: 1.0
    simulation/partial_atomic_charge: 1.0
    simulation/homo: 1.0
    simulation/lumo: 1.0
    simulation/simulated_qm_elec_hf: 1.0
    simulation/thermal_expansion: 0.8
    simulation/transfer_organic: 0.5
  task_loss_modes:
    simulation/simulated_qm_elec_hf: masked_target_macro
training:
  batch_size: 256
  gradient_accumulation_steps: 1
  epochs: 10
  backbone_frozen_epochs: 0
  backbone_learning_rate: 1.5e-05
  object_encoder_learning_rate: 4.5e-05
  task_head_learning_rate: 1.5e-04
  weight_decay: 0.01
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  packing_workers: 4
  packing_prefetch_batches: 4
  cuda_prefetch_batches: 1
  log_every_batches: 50
  device: auto
  amp_dtype: bf16
  refinement_epochs: 10
  refinement_tasks:
    - simulation/heat_of_vaporization
    - simulation/homo
    - simulation/lumo
    - simulation/partial_atomic_charge
  refinement_lr_multiplier: 0.10
