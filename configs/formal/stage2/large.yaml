data:
  stage2_dir: data/stage2
  pretrain_artifacts_dir: outputs/formal_v1/stage1/base/prepare/artifacts
  artifacts_dir: outputs/formal_v1/stage2/large/prepare/artifacts
  entity_shard_size: 4096
  shard_cache_size: 10
  teacher_batch_size: 128
  transfer_validation_limit: 10000
  seed: 42
initialization:
  checkpoint: outputs/formal_v1/stage1/large/train/checkpoint_epoch_00005.pt
sampling:
  probabilities:
    simulated_qm_elec_hf: 0.35
    density: 0.20
    heat_capacity: 0.15
    thermal_expansion: 0.15
    transfer_organic: 0.15
  block_size: 20
model:
  head_dropout: 0.10
loss:
  lambda_alignment: 0.10
training:
  batch_size: 128
  gradient_accumulation_steps: 2
  max_steps: 23440
  backbone_learning_rate: 0.00001
  head_learning_rate: 0.0001
  weight_decay: 0.01
  warmup_fraction: 0.05
  backbone_freeze_fraction: 0.10
  max_grad_norm: 1.0
  device: auto
  amp_dtype: bf16
  validation_interval_steps: 1000
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0001
  save_every_n_steps: 1000
