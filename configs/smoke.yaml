data:
  stage1_dir: data/stage1
  artifacts_dir: artifacts/smoke
  valid_fraction: 0.05
  seed: 42
  max_smiles_tokens: 384
  descriptor_dim: 217
  max_samples_per_role: 20

masking:
  smiles_ratio: 0.15
  atom_ratio: 0.15
  bond_ratio: 0.15
  descriptor_ratio: 0.15
  smiles_dropout: 0.10
  graph_dropout: 0.10
  descriptor_dropout: 0.10
  asymmetric_enabled: false
  asymmetric_probability: 0.25
  asymmetric_ratio: 0.50

model:
  d_model: 128
  n_heads: 4
  smiles_layers: 2
  graph_depth: 3
  descriptor_hidden_dim: 256
  descriptor_blocks: 2
  fusion_layers: 2
  feedforward_dim: 512
  dropout: 0.10

loss:
  lambda_smiles: 1.0
  lambda_descriptor: 1.0
  lambda_atom: 1.0
  lambda_bond: 1.0

smoke:
  batch_size: 10
  steps: 2
  learning_rate: 0.0003
  weight_decay: 0.01
  num_workers: 0
  device: auto
  amp: true
