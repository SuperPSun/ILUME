data:
  stage2_dir: data/stage2
  pretrain_artifacts_dir: outputs/v1/stage1/base/prepare/artifacts
  artifacts_dir: outputs/v1/stage2/base/prepare/artifacts
  entity_shard_size: 4096
  shard_cache_size: 10
  teacher_batch_size: 256
  seed: 42
initialization:
  checkpoint: outputs/v1/stage1/base/train/checkpoint_epoch_00005.pt
model:
  object_layers: 2
  object_ffn_dim: 1024
  dropout: 0.10
loss:
  lambda_teacher: 0.10
  task_weights:
    simulated_qm_elec_hf: 0.25
    density: 0.25
    heat_capacity: 0.20
    thermal_expansion: 0.20
    transfer_organic: 0.10
training:
  batch_size: 256
  gradient_accumulation_steps: 1
  epochs: 5
  backbone_frozen_epochs: 1
  backbone_learning_rate: 0.00001
  stage2_new_module_learning_rate: 0.0001
  weight_decay: 0.01
  warmup_fraction: 0.05
  max_grad_norm: 1.0
  device: auto
  amp_dtype: bf16
